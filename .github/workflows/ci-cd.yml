name: RacingDays Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ "main", "part-3", "feature/*" ]
  pull_request:
    branches: [ "main", "part-3" ]

jobs:
  build-and-test:
    name: Build & Test Applications
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK (10.0.x)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore RacingDays/RacingDays.slnx

    - name: Build Solution (Release)
      run: dotnet build RacingDays/RacingDays.slnx --configuration Release --no-restore

    - name: Run Test Suites
      run: dotnet test RacingDays/RacingDays.slnx --configuration Release --no-build --verbosity normal

  docker-build:
    name: Validate Docker Images
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Build Web API Docker Image
      run: docker build -t raceday-api:latest -f RacingDays/RacingDays.API/Dockerfile RacingDays

    - name: Build MVC Web Docker Image
      run: docker build -t raceday-web:latest -f RacingDays/RacingDays.web/Dockerfile RacingDays

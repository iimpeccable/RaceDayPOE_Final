name: RacingDays Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ "main", "part-3", "feature/*" ]
  pull_request:
    branches: [ "main", "part-3" ]

jobs:
  build-and-test:
    name: Build & Test Applications
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK (10.0.x)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Backend API
      run: dotnet restore RacingDays/RacingDays.API/RacingDays.API.csproj

    - name: Restore Web MVC
      run: dotnet restore RacingDays/Racingdays.web/RacingDays.Web.csproj

    - name: Build Backend API (Release)
      run: dotnet build RacingDays/RacingDays.API/RacingDays.API.csproj --configuration Release --no-restore

    - name: Build Web MVC (Release)
      run: dotnet build RacingDays/Racingdays.web/RacingDays.Web.csproj --configuration Release --no-restore

  docker-build:
    name: Validate Docker Images
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Build Web API Docker Image
      run: docker build -t raceday-api:latest -f RacingDays/RacingDays.API/Dockerfile RacingDays

    - name: Build MVC Web Docker Image
      run: docker build -t raceday-web:latest -f RacingDays/Racingdays.web/Dockerfile RacingDays
